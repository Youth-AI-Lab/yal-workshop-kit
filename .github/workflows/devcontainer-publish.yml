# =====================================================================
# devcontainer-publish.yml : publie l'image du Codespace sur ghcr.io.
# Même mécanique que IUTInfoAix/IntroPython.
#
# Pourquoi : sans image publiée, chaque Codespace exécute toute l'installation à sa création
# (plusieurs minutes par binôme). Avec elle, la création se réduit à un téléchargement
# (.devcontainer/devcontainer.json pointe sur l'image).
#
# L'image est construite à partir de .devcontainer/source/ et n'est publiée que si le
# smoke-test passe dans le conteneur.
#
# MULTI-ARCHITECTURE (depuis 2026-10-27) : l'image est construite pour linux/amd64 ET
# linux/arm64, chacune sur un runner NATIF (ubuntu-latest et ubuntu-24.04-arm, gratuits pour
# les dépôts publics) — pas d'émulation QEMU. Le smoke-test tourne sur chaque architecture.
# Les Mac Apple Silicon peuvent alors ouvrir le kit en local sans émulation (guide Youth-AI-Lab/yal-devcontainer-guide).
# Le job `merge` assemble les deux images en un seul manifeste `IMAGE:VERSION` (c'est lui que
# devcontainer.json désigne) ; les images par architecture `IMAGE:VERSION-linux-amd64` et
# `IMAGE:VERSION-linux-arm64` restent dans le paquet comme sous-produits.
#
# Déclencheurs, tous deux manuels :
#   - push d'un tag git `devcontainer-AAAA.MM.N` ;
#   - workflow_dispatch avec la version en paramètre.
#
# Jamais de tag `latest`, et une version publiée n'est jamais écrasée : les Codespaces déjà
# créés pointent dessus.
# =====================================================================
name: devcontainer-publish

on:
  push:
    tags:
      - "devcontainer-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image, au format AAAA.MM.N (exemple : 2026.10.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/youth-ai-lab/yal-workshop-devcontainer

jobs:
  # 1. Une seule fois : déterminer la version, refuser d'écraser une version déjà publiée.
  preflight:
    name: version & garde
    if: github.repository == 'Youth-AI-Lab/yal-workshop-kit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Détermine la version
        id: version
        env:
          VERSION_SAISIE: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$VERSION_SAISIE"
          else
            version="${GITHUB_REF_NAME#devcontainer-}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "::error::Version « $version » invalide : le format attendu est AAAA.MM.N"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse d'écraser une version déjà publiée
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if sortie=$(docker manifest inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION existe déjà. Choisissez une nouvelle version."
            exit 1
          elif printf '%s' "$sortie" | grep -qiE "manifest unknown|name unknown"; then
            echo "$IMAGE:$VERSION n'existe pas encore : la publication peut continuer."
          else
            echo "::error::Impossible de savoir si $IMAGE:$VERSION existe déjà : $sortie"
            exit 1
          fi

  # 2. Une image par architecture, sur un runner natif, avec le smoke-test dans le conteneur.
  build:
    name: build & smoke-test (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Pousse l'image de cette architecture sous un tag suffixé automatiquement
      # (IMAGE:VERSION-linux-amd64 / -linux-arm64) ; le job merge les assemblera.
      - name: Build, smoke-test & push (par architecture)
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/source/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ needs.preflight.outputs.version }}
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          noCache: true
          runCmd: .devcontainer/smoke-test.sh
          push: always

  # 3. Assemble les deux images en un manifeste multi-architecture IMAGE:VERSION.
  merge:
    name: manifeste multi-arch
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Assemble le manifeste
        uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ needs.preflight.outputs.version }}
          platforms: linux/amd64,linux/arm64

      - name: Résumé et suite à donner
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "## Image multi-arch construite et testée : \`$IMAGE:$VERSION\`"
            echo
            echo "Deux architectures (linux/amd64, linux/arm64), chacune construite et smoke-testée sur un runner natif, puis assemblées en un manifeste. Les images par architecture (\`$IMAGE:$VERSION-linux-amd64\`, \`$IMAGE:$VERSION-linux-arm64\`) restent dans le paquet comme sous-produits."
            echo
            if grep -q "$IMAGE:$VERSION\"" .devcontainer/devcontainer.json 2>/dev/null; then
              echo "La configuration distribuée pointe déjà sur cette version."
            else
              echo "**À faire** : mettre cette version dans \`.devcontainer/devcontainer.json\` (kit et guides)."
            fi
            echo
            echo "À la première publication, rendre le paquet **public** (Packages → Package settings → Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"
