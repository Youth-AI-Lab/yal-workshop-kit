# =====================================================================
# devcontainer-publish.yml : publie l'image du Codespace sur ghcr.io.
# Même mécanique que IUTInfoAix/IntroPython.
#
# Pourquoi : sans image publiée, chaque Codespace exécute toute l'installation à sa création
# (plusieurs minutes par binôme). Avec elle, la création se réduit à un téléchargement
# (.devcontainer/devcontainer.json pointe sur l'image).
#
# L'image est construite à partir de .devcontainer/source/ et n'est publiée que si le
# smoke-test passe dans le conteneur.
#
# Déclencheurs, tous deux manuels :
#   - push d'un tag git `devcontainer-AAAA.MM.N` ;
#   - workflow_dispatch avec la version en paramètre.
#
# Jamais de tag `latest`, et une version publiée n'est jamais écrasée : les Codespaces déjà
# créés pointent dessus.
# =====================================================================
name: devcontainer-publish

on:
  push:
    tags:
      - "devcontainer-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image, au format AAAA.MM.N (exemple : 2026.10.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/youth-ai-lab/yal-workshop-devcontainer

jobs:
  publish:
    name: build, smoke-test & publish
    if: github.repository == 'Youth-AI-Lab/yal-workshop-kit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Détermine la version
        id: version
        env:
          VERSION_SAISIE: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$VERSION_SAISIE"
          else
            version="${GITHUB_REF_NAME#devcontainer-}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "::error::Version « $version » invalide : le format attendu est AAAA.MM.N"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse d'écraser une version déjà publiée
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if sortie=$(docker manifest inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION existe déjà. Choisissez une nouvelle version."
            exit 1
          elif printf '%s' "$sortie" | grep -qiE "manifest unknown|name unknown"; then
            echo "$IMAGE:$VERSION n'existe pas encore : la publication peut continuer."
          else
            echo "::error::Impossible de savoir si $IMAGE:$VERSION existe déjà : $sortie"
            exit 1
          fi

      - name: Build, smoke-test & publish
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/source/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ steps.version.outputs.version }}
          noCache: true
          runCmd: .devcontainer/smoke-test.sh
          push: always

      - name: Résumé et suite à donner
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Image construite et testée : \`$IMAGE:$VERSION\`"
            echo
            echo "Le push vers ghcr.io a lieu à la fin du job (« Post Build, smoke-test & publish ») : vérifiez qu'elle est verte."
            echo
            if grep -q "$IMAGE:$VERSION\"" .devcontainer/devcontainer.json; then
              echo "La configuration distribuée pointe déjà sur cette version."
            else
              echo "**À faire** : mettre cette version dans \`.devcontainer/devcontainer.json\`."
            fi
            echo
            echo "À la première publication, rendre le paquet **public** (Packages → Package settings → Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"
