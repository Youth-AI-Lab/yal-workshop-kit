version = 1
SPDX-PackageName = "Youth AI Lab - Customising a chatbot"
SPDX-PackageSupplier = "Youth AI Lab (Erasmus+)"
SPDX-PackageDownloadLocation = "https://github.com/Youth-AI-Lab/yal-workshop-kit"

# The same file in the kit and in each workshop repository: a path that is not there is ignored.

# Texts and screenshots: the pages, the sheets, the test questions, the summaries, the wiki, the
# example chatbots and the skills: CC BY-SA 4.0. The screenshots show the interfaces of Claude Code,
# Open WebUI, VS Code and GitHub, which belong to their authors.
[[annotations]]
path = ["README.md", "sheet.md", "SETUP.md", "LOCAL.md", "AGENTS.md", "CLAUDE.md", "scores.md", "test-questions.md", "examples/**", "summaries/**", "images/**", ".claude/skills/**", ".workshop/**", "corpus/index.md", "inbox/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Youth AI Lab partners"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Configuration files and programs: EUPL-1.2, as in the guides of the project.
[[annotations]]
path = [".devcontainer/**", ".github/**", ".vscode/**", ".gitattributes", ".gitignore", ".mcp.json", ".mcp.weather.json", "mcp/**", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Youth AI Lab partners"
SPDX-License-Identifier = "EUPL-1.2"

# The official documents are not ours: see LICENSES/LicenseRef-Third-Party.txt.
[[annotations]]
path = ["corpus/*.html", "corpus/*.pdf", "corpus/*.docx", "corpus/text/**", "inbox/*.pdf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The publishers named in each document"
SPDX-License-Identifier = "LicenseRef-Third-Party"
